<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一斤八两 · 瓜摊灰盒</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">PHASE 3 · INTERACTIVE GREYBOX</p>
          <h1>一斤八两</h1>
        </div>
        <button id="restart" type="button">重新开始</button>
      </header>

      <section class="game">
        <div class="scene-panel">
          <canvas id="scene" width="960" height="540" aria-label="瓜摊俯视灰盒场景"></canvas>
          <div class="legend">
            <span><i class="player"></i>周烈</span>
            <span><i class="merchant"></i>摊主</span>
            <span><i class="helper"></i>帮手</span>
            <span><i class="witness"></i>证人</span>
          </div>
        </div>

        <aside>
          <div class="status">
            <div><span>阶段</span><strong id="phase"></strong></div>
            <div><span>警觉</span><strong id="alert"></strong></div>
            <div><span>支持</span><strong id="support"></strong></div>
          </div>
          <h2>可执行行动</h2>
          <div id="actions" class="actions"></div>
          <h2>现场记录</h2>
          <ol id="log" class="log"></ol>
        </aside>
      </section>

      <section id="result" class="result" hidden></section>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
